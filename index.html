<h2 class="sr-only">Wordle minigame</h2>

<link rel="stylesheet" href="style.css">

<div id="wordle-root">
  <div id="stats-bar">
    <div class="stat-item"><span class="stat-num" id="stat-played">0</span>played</div>
    <div class="stat-item"><span class="stat-num" id="stat-win">0</span>wins</div>
    <div class="stat-item"><span class="stat-num" id="stat-streak">0</span>streak</div>
    <div class="stat-item"><span class="stat-num" id="stat-avg">–</span>avg tries</div>
  </div>
  <div id="message"></div>
  <div id="board"></div>
  <button id="new-game-btn">New game</button>
  <div id="keyboard"></div>
</div>

<script src="index.js" defer></script>
